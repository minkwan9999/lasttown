<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Town - 마지막 마을</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:sans-serif;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{background:#2d4a2b;max-width:100%;max-height:100%;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="600"></canvas></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const keys = {}; let mouse = {x: W/2, y: H/2, down: false};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function pos(e){ const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e;
  mouse.x = (t.clientX - r.left) * W / r.width; mouse.y = (t.clientY - r.top) * H / r.height; }
cv.addEventListener('mousemove', pos);
cv.addEventListener('mousedown', e => { pos(e); mouse.down = true; if (state !== 'play') start(); });
addEventListener('mouseup', () => mouse.down = false);
cv.addEventListener('touchstart', e => { pos(e); mouse.down = true; if (state !== 'play') start(); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove', e => { pos(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', () => mouse.down = false);
addEventListener('keydown', e => { if (e.key === 'Enter' && state !== 'play') start(); });

let state = 'menu', player, zombies, bullets, pickups, particles, wave, score, town, spawnLeft, spawnTimer, best = +localStorage.lasttownBest || 0;
const TOWN = {x: W/2, y: H/2, r: 40};

function start() {
  state = 'play'; score = 0; wave = 0; town = {hp: 100};
  player = {x: W/2, y: H/2 + 80, hp: 100, speed: 3, cd: 0, ammo: 30, reload: 0, weapon: 0};
  zombies = []; bullets = []; pickups = []; particles = [];
  nextWave();
}
function nextWave() { wave++; spawnLeft = 5 + wave * 3; spawnTimer = 0; }

function spawnZombie() {
  const side = Math.floor(Math.random() * 4); let x, y;
  if (side === 0) { x = Math.random() * W; y = -20; }
  else if (side === 1) { x = W + 20; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 20; }
  else { x = -20; y = Math.random() * H; }
  const big = Math.random() < Math.min(0.05 + wave * 0.02, 0.25);
  zombies.push({x, y, hp: big ? 6 : 2 + Math.floor(wave / 4), r: big ? 16 : 11, speed: (big ? 0.7 : 1 + Math.random() * 0.5) + wave * 0.04, big, hitCd: 0});
}

function burst(x, y, color, n = 6) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 1 + Math.random() * 3;
    particles.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 15, color}); }
}

function shoot() {
  if (player.cd > 0 || player.reload > 0) return;
  if (player.ammo <= 0) { player.reload = 70; return; }
  const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const shots = player.weapon === 1 ? [-0.2, 0, 0.2] : [0];
  for (const o of shots) {
    const aa = a + o + (Math.random() - 0.5) * 0.06;
    bullets.push({x: player.x, y: player.y, vx: Math.cos(aa) * 10, vy: Math.sin(aa) * 10, life: 60});
  }
  player.ammo--; player.cd = player.weapon === 1 ? 22 : 8;
}

function update() {
  const p = player;
  let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (dx || dy) { const l = Math.hypot(dx, dy); p.x += dx / l * p.speed; p.y += dy / l * p.speed; }
  p.x = Math.max(10, Math.min(W - 10, p.x)); p.y = Math.max(10, Math.min(H - 10, p.y));
  if (p.cd > 0) p.cd--;
  if (keys['r'] && p.reload <= 0 && p.ammo < 30) p.reload = 70;
  if (p.reload > 0 && --p.reload === 0) p.ammo = 30;
  if (mouse.down || keys[' ']) shoot();

  if (spawnLeft > 0 && --spawnTimer <= 0) { spawnZombie(); spawnLeft--; spawnTimer = Math.max(15, 60 - wave * 3); }

  for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; }
  bullets = bullets.filter(b => b.life > 0 && b.x > 0 && b.x < W && b.y > 0 && b.y < H);

  for (const z of zombies) {
    // 마을 쪽으로 이동, 플레이어가 가까우면 플레이어 추격
    const dp = Math.hypot(p.x - z.x, p.y - z.y);
    const tx = dp < 150 ? p.x : TOWN.x, ty = dp < 150 ? p.y : TOWN.y;
    const a = Math.atan2(ty - z.y, tx - z.x);
    z.x += Math.cos(a) * z.speed; z.y += Math.sin(a) * z.speed;
    if (z.hitCd > 0) z.hitCd--;
    if (dp < z.r + 10 && z.hitCd === 0) { p.hp -= z.big ? 12 : 6; z.hitCd = 40; burst(p.x, p.y, '#c33', 5); }
    if (Math.hypot(TOWN.x - z.x, TOWN.y - z.y) < TOWN.r + z.r && z.hitCd === 0) { town.hp -= z.big ? 6 : 3; z.hitCd = 40; burst(TOWN.x, TOWN.y, '#fa3', 4); }
    for (const b of bullets) {
      if (b.life > 0 && Math.hypot(b.x - z.x, b.y - z.y) < z.r) {
        z.hp--; b.life = 0; burst(z.x, z.y, '#7a2', 3);
        if (z.hp <= 0) {
          score += z.big ? 30 : 10; burst(z.x, z.y, '#5a1', 10);
          const r = Math.random();
          if (r < 0.12) pickups.push({x: z.x, y: z.y, type: 'heal'});
          else if (r < 0.2) pickups.push({x: z.x, y: z.y, type: 'repair'});
          else if (r < 0.26) pickups.push({x: z.x, y: z.y, type: 'shotgun'});
        }
      }
    }
  }
  zombies = zombies.filter(z => z.hp > 0);

  for (const k of pickups) {
    if (Math.hypot(k.x - p.x, k.y - p.y) < 18) {
      if (k.type === 'heal') p.hp = Math.min(100, p.hp + 30);
      if (k.type === 'repair') town.hp = Math.min(100, town.hp + 25);
      if (k.type === 'shotgun') { p.weapon = 1; p.ammo = 30; setTimeout(() => p.weapon = 0, 12000); }
      k.dead = true;
    }
  }
  pickups = pickups.filter(k => !k.dead);

  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.life--; }
  particles = particles.filter(q => q.life > 0);

  if (spawnLeft === 0 && zombies.length === 0) nextWave();
  if (p.hp <= 0 || town.hp <= 0) {
    state = 'over'; if (score > best) { best = score; localStorage.lasttownBest = best; }
  }
}

function bar(x, y, w, v, color) {
  ctx.fillStyle = '#000a'; ctx.fillRect(x, y, w, 10);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, v) / 100, 10);
}
function text(s, x, y, size = 20, align = 'center', color = '#fff') {
  ctx.fillStyle = color; ctx.font = `bold ${size}px sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
}

function draw() {
  ctx.fillStyle = '#2d4a2b'; ctx.fillRect(0, 0, W, H);
  if (state === 'menu') {
    text('LAST TOWN', W/2, 220, 64); text('마지막 마을을 지켜라', W/2, 270, 26);
    text('WASD 이동 · 마우스 조준/발사 · R 재장전', W/2, 340, 18);
    text('좀비로부터 마을과 자신을 지키세요', W/2, 370, 18);
    text('클릭 또는 Enter로 시작', W/2, 440, 24, 'center', '#ff0');
    text('최고 점수: ' + best, W/2, 490, 18);
    return;
  }
  // 마을
  ctx.fillStyle = '#7b5a3a'; ctx.beginPath(); ctx.arc(TOWN.x, TOWN.y, TOWN.r, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#b33'; ctx.beginPath(); ctx.moveTo(TOWN.x - 28, TOWN.y - 8); ctx.lineTo(TOWN.x, TOWN.y - 38); ctx.lineTo(TOWN.x + 28, TOWN.y - 8); ctx.fill();
  ctx.fillStyle = '#dca'; ctx.fillRect(TOWN.x - 22, TOWN.y - 8, 44, 28);

  for (const k of pickups) {
    ctx.fillStyle = k.type === 'heal' ? '#f55' : k.type === 'repair' ? '#fa3' : '#5cf';
    ctx.fillRect(k.x - 7, k.y - 7, 14, 14);
    text(k.type === 'heal' ? '+' : k.type === 'repair' ? '🔧' : 'S', k.x, k.y + 5, 12, 'center', '#000');
  }
  for (const z of zombies) {
    ctx.fillStyle = z.big ? '#385' : '#6a4'; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#f00'; ctx.fillRect(z.x - 4, z.y - 3, 3, 3); ctx.fillRect(z.x + 2, z.y - 3, 3, 3);
  }
  ctx.fillStyle = '#ff8';
  for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  for (const q of particles) { ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, 3, 3); }

  const p = player, a = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  ctx.fillStyle = '#39f'; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(a) * 18, p.y + Math.sin(a) * 18); ctx.stroke();

  // HUD
  text('플레이어', 10, 18, 12, 'left'); bar(10, 22, 150, p.hp, '#e44');
  text('마을', 10, 50, 12, 'left'); bar(10, 54, 150, town.hp, '#fa3');
  text(`웨이브 ${wave}`, W/2, 24, 22); text(`점수 ${score}`, W - 10, 24, 18, 'right');
  text(p.reload > 0 ? '재장전 중...' : `탄약 ${p.ammo}/30${p.weapon ? ' (샷건)' : ''}`, W - 10, 48, 16, 'right');

  if (state === 'over') {
    ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W/2, 250, 56, 'center', '#f55');
    text(town.hp <= 0 ? '마을이 무너졌습니다' : '당신이 쓰러졌습니다', W/2, 295, 22);
    text(`웨이브 ${wave} · 점수 ${score} · 최고 ${best}`, W/2, 335, 20);
    text('클릭 또는 Enter로 다시 시작', W/2, 400, 22, 'center', '#ff0');
  }
}

function loop() { if (state === 'play') update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
